[package]
name = "pi-viewer"
version = "0.1.0"
description = "Desktop viewer and chat interface for Pi"
edition = "2021"

[lib]
name = "pi_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dunce = "1"
rfd = "0.17.2"
base64 = "0.22"
